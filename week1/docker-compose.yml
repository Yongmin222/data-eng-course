services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: engineer
      POSTGRES_PASSWORD: engineer123
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    depends_on:
      - db

  app:
    build: ./app
    depends_on:
      - db

volumes:
  pgdata:
